<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Header</title>
  <style>
    html, body {
      margin: 0;
      width: 1600px;
      height: 760px;
      overflow: hidden;
      background: #071007;
      color: #f4f7ef;
      font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .page {
      box-sizing: border-box;
      width: 1600px;
      height: 760px;
      padding: 64px 80px 56px;
      position: relative;
    }
    .bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 16px;
      background: #76b900;
    }
    .kicker {
      margin: 0;
      color: #76b900;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.22em;
    }
    h1 {
      margin: 28px 0 0;
      max-width: 980px;
      font-size: 92px;
      line-height: 0.96;
      font-weight: 650;
      letter-spacing: -0.035em;
    }
    .rule {
      width: 220px;
      height: 8px;
      margin-top: 36px;
      background: #76b900;
    }
    .deck {
      margin: 28px 0 0;
      max-width: 820px;
      font-size: 32px;
      line-height: 1.35;
      color: #d5decb;
      font-weight: 500;
    }
    .facts {
      position: absolute;
      left: 80px;
      bottom: 56px;
      display: flex;
      gap: 18px;
    }
    .fact {
      min-width: 210px;
      padding: 16px 18px 14px;
      border: 1px solid #2a3a22;
      background: #101710;
    }
    .fact b {
      display: block;
      color: #76b900;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    .fact span {
      display: block;
      margin-top: 4px;
      color: #c5d0bc;
      font-size: 16px;
      letter-spacing: 0.04em;
    }
    .wave {
      position: absolute;
      right: 72px;
      top: 180px;
      width: 460px;
      height: 280px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .wave i {
      display: block;
      width: 8px;
      background: #76b900;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="bar"></div>
    <p class="kicker">NVIDIA</p>
    <h1>Nemotron 3.5 Transcribe</h1>
    <div class="rule"></div>
    <p class="deck">One recording. A transcript you can use. Forty languages, eight speakers, your GPU.</p>
    <div class="facts">
      <div class="fact"><b>40</b><span>languages</span></div>
      <div class="fact"><b>60 min</b><span>in one pass</span></div>
      <div class="fact"><b>8 speakers</b><span>in 13 languages</span></div>
    </div>
    <div class="wave" aria-hidden="true">
      <i style="height:46px"></i><i style="height:78px"></i><i style="height:120px"></i>
      <i style="height:168px"></i><i style="height:96px"></i><i style="height:54px"></i>
      <i style="height:30px"></i><i style="height:22px"></i><i style="height:38px"></i>
      <i style="height:88px"></i><i style="height:150px"></i><i style="height:210px"></i>
      <i style="height:132px"></i><i style="height:70px"></i><i style="height:36px"></i>
      <i style="height:24px"></i><i style="height:48px"></i><i style="height:110px"></i>
      <i style="height:176px"></i><i style="height:240px"></i><i style="height:160px"></i>
      <i style="height:90px"></i><i style="height:44px"></i><i style="height:28px"></i>
    </div>
  </div>
</body>
</html>
